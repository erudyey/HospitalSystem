[project]
name = "hospitalsystem"
version = "2.0.0"
description = "Modern Hospital Management Desktop Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "waitress>=3.0.0",
    "pywebview>=6.0.0",
    "whitenoise>=6.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
pythonpath = ["."]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
