[project]
name = "hospitalsystem"
version = "0.1.0b1"
description = "Modern Hospital Management Desktop Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "waitress>=3.0.0",
    "pywebview>=6.0.0",
    "whitenoise>=6.8.0",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.8.0",
    "django-stubs>=5.1.0",
    "pyinstaller>=6.10.0",
    "basedpyright>=1.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "desktop*"]
exclude = ["frontend*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
pythonpath = ["."]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
