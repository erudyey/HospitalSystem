name: CI

on:
  push:
    branches: [ master, migrate/*, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python Dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe django waitress pywebview whitenoise pytest pytest-django ruff django-stubs pyinstaller

      - name: Check Formatting & Linting
        run: |
          .venv\Scripts\ruff.exe check backend desktop
          .venv\Scripts\ruff.exe format --check backend desktop

      - name: Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          deno install
          deno task build

      - name: Run Backend Tests
        run: |
          .venv\Scripts\pytest.exe backend/tests/

      - name: Run Legacy Regression Tests
        run: |
          .venv\Scripts\python.exe -m unittest discover -s tests -v
