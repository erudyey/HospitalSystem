name: CI

on:
  push:
    branches: [master, experimental, "feature/**"]
  pull_request:
    branches: [master, experimental]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up virtual environment and install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Zero Em/En Dash Compliance
        run: |
          uv run python -c "import os, sys; errors = [f'{os.path.join(r, fn)}: contains dash' for r, _, fs in os.walk('.') if not any(ign in r for ign in ['.git', '.venv', 'dist', 'build', 'node_modules', '.gemini']) for fn in fs if fn.endswith(('.py', '.svelte', '.ts', '.css', '.ps1', '.sh', '.md', '.json', '.html', '.yml', '.yaml')) for f in [os.path.join(r, fn)] if '\u2014' in open(f, 'r', encoding='utf-8', errors='ignore').read() or '\u2013' in open(f, 'r', encoding='utf-8', errors='ignore').read()]; (print('\n'.join(errors)) or sys.exit(1)) if errors else print('Zero em/en dashes found.')"

      - name: Check Formatting & Linting
        run: |
          uv run ruff check backend desktop package.py
          uv run ruff format --check backend desktop package.py

      - name: Strict Python Type Check
        run: uv run python -m basedpyright

      - name: Check Workflow Formatting
        run: deno fmt --check .github/workflows/

      - name: Compile Frontend
        working-directory: ./frontend
        run: |
          deno install
          deno task build

      - name: Run Backend Tests
        run: uv run pytest backend/tests/ -v

  alpha-build-windows:
    name: Alpha Build (Windows)
    if: github.event_name == 'pull_request' && github.head_ref == 'review/experimental-adversarial-alpha'
    needs: [test]
    runs-on: windows-latest
    env:
      ALPHA_VERSION: 0.0.2-alpha.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Build frontend
        working-directory: ./frontend
        run: |
          deno install
          deno task build

      - name: Build and verify executable
        run: |
          uv run python package.py --clean
          uv run python desktop/verify_bundle.py
          Move-Item dist/HospitalSystem.exe "dist/HospitalSystem-v$env:ALPHA_VERSION-Windows-x64.exe"

      - name: Upload alpha executable
        uses: actions/upload-artifact@v4
        with:
          name: HospitalSystem-v${{ env.ALPHA_VERSION }}-Windows-x64
          path: dist/HospitalSystem-v${{ env.ALPHA_VERSION }}-Windows-x64.exe
          if-no-files-found: error

  alpha-build-macos:
    name: Alpha Build (macOS)
    if: github.event_name == 'pull_request' && github.head_ref == 'review/experimental-adversarial-alpha'
    needs: [test]
    runs-on: macos-latest
    env:
      ALPHA_VERSION: 0.0.2-alpha.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Build frontend
        working-directory: ./frontend
        run: |
          deno install
          deno task build

      - name: Build and verify application
        run: |
          uv run python package.py --clean
          dist/HospitalSystem.app/Contents/MacOS/HospitalSystem --verify
          cd dist
          zip -r -y "HospitalSystem-v$ALPHA_VERSION-macOS.zip" HospitalSystem.app

      - name: Upload alpha application
        uses: actions/upload-artifact@v4
        with:
          name: HospitalSystem-v${{ env.ALPHA_VERSION }}-macOS
          path: dist/HospitalSystem-v${{ env.ALPHA_VERSION }}-macOS.zip
          if-no-files-found: error
